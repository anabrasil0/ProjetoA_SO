<text x="15" y="400" font-family="monospace" font-size="13" font-weight="bold" fill="black">Legenda:</text>
<rect x="15" y="408" width="32" height="17" fill="#FF0000" stroke="#999"/>
<text x="53" y="422" font-family="monospace" font-size="12" fill="black">T1 = cor da tarefa na secao CPUs e Tarefas</text>
<rect x="15" y="430" width="32" height="17" fill="#00FF00" stroke="#999"/>
<text x="53" y="444" font-family="monospace" font-size="12" fill="black">T2 = cor da tarefa na secao CPUs e Tarefas</text>
<rect x="15" y="452" width="32" height="17" fill="#0000FF" stroke="#999"/>
<text x="53" y="466" font-family="monospace" font-size="12" fill="black">T3 = cor da tarefa na secao CPUs e Tarefas</text>
<rect x="15" y="474" width="32" height="17" fill="#FFFF00" stroke="#999"/>
<text x="53" y="488" font-family="monospace" font-size="12" fill="black">T4 = cor da tarefa na secao CPUs e Tarefas</text>
<rect x="15" y="496" width="32" height="17" fill="#FF00FF" stroke="#999"/>
<text x="53" y="510" font-family="monospace" font-size="12" fill="black">T5 = cor da tarefa na secao CPUs e Tarefas</text>
<rect x="15" y="518" width="32" height="17" fill="#2a2a2a" stroke="#111"/>
<text x="31" y="532" font-family="monospace" font-size="10" text-anchor="middle" fill="#ddd">OFF</text>
<text x="53" y="532" font-family="monospace" font-size="12" fill="black">processador desligado (sem tarefas no sistema)</text>
<rect x="15" y="540" width="32" height="17" fill="#f0f0f0" stroke="#bbb"/>
<text x="31" y="554" font-family="monospace" font-size="10" text-anchor="middle" fill="#ddd">-</text>
<text x="53" y="554" font-family="monospace" font-size="12" fill="black">processador ocioso (ligado sem tarefa atribuida)</text>
<rect x="15" y="562" width="32" height="17" fill="#f5f5f5" stroke="#bbb"/>
<text x="31" y="576" font-family="monospace" font-size="10" text-anchor="middle" fill="#ddd">.</text>
<text x="53" y="576" font-family="monospace" font-size="12" fill="black">tarefa aguardando CPU (fila de prontos)</text>
<rect x="15" y="584" width="32" height="17" fill="#f5f5f5" stroke="#bbb"/>
<text x="31" y="598" font-family="monospace" font-size="10" text-anchor="middle" fill="#ddd">>></text>
<text x="53" y="598" font-family="monospace" font-size="12" fill="black">tarefa chegou e ficou aguardando CPU neste tick</text>
<rect x="15" y="606" width="32" height="17" fill="white" stroke="#bbb"/>
<text x="31" y="620" font-family="monospace" font-size="11" text-anchor="middle" fill="#228B22">▶</text>
<text x="53" y="620" font-family="monospace" font-size="12" fill="black">tarefa chegou e ja comecou a executar neste tick</text>
<rect x="15" y="628" width="32" height="17" fill="white" stroke="#bbb"/>
<text x="31" y="642" font-family="monospace" font-size="12" text-anchor="middle" fill="#228B22">✓</text>
<text x="53" y="642" font-family="monospace" font-size="12" fill="black">tarefa termina neste tick (ultimo ciclo de execucao)</text>
<rect x="15" y="650" width="32" height="17" fill="white" stroke="#bbb"/>
<text x="31" y="664" font-family="monospace" font-size="10" text-anchor="middle" fill="#ddd">L</text>
<text x="53" y="664" font-family="monospace" font-size="12" fill="black">tarefa adquiriu/tentou mutex neste tick, executando (Req. 2.8)</text>
<rect x="15" y="672" width="32" height="17" fill="white" stroke="#bbb"/>
<text x="31" y="686" font-family="monospace" font-size="10" text-anchor="middle" fill="#ddd">U</text>
<text x="53" y="686" font-family="monospace" font-size="12" fill="black">tarefa liberou mutex neste tick, executando (Req. 2.8)</text>
<rect x="15" y="694" width="32" height="17" fill="#00008B" stroke="#111"/>
<text x="31" y="708" font-family="monospace" font-size="10" text-anchor="middle" fill="#ddd">I</text>
<text x="53" y="708" font-family="monospace" font-size="12" fill="black">tarefa iniciou operacao de E/S neste tick, executando (Req. 3)</text>
<rect x="15" y="716" width="32" height="17" fill="white" stroke="#bbb"/>
<text x="31" y="730" font-family="monospace" font-size="10" text-anchor="middle" fill="#ddd">?</text>
<text x="53" y="730" font-family="monospace" font-size="12" fill="black">tarefa escolhida por sorteio aleatorio</text>
<rect x="15" y="738" width="32" height="17" fill="url(#hatchMutex)" stroke="#111"/>
<text x="31" y="752" font-family="monospace" font-size="10" text-anchor="middle" fill="#ddd">MUT</text>
<text x="53" y="752" font-family="monospace" font-size="12" fill="black">tarefa suspensa aguardando mutex — hachura vermelha (Req. 2.9)</text>
<rect x="15" y="760" width="32" height="17" fill="url(#hatchIO)" stroke="#111"/>
<text x="31" y="774" font-family="monospace" font-size="10" text-anchor="middle" fill="#ddd">I/O</text>
<text x="53" y="774" font-family="monospace" font-size="12" fill="black">tarefa suspensa aguardando E/S — hachura azul (Req. 2.9)</text>
<rect x="15" y="782" width="32" height="17" fill="#ebebeb" stroke="#bbb"/>
<text x="31" y="796" font-family="monospace" font-size="10" text-anchor="middle" fill="#ddd">fim</text>
<text x="53" y="796" font-family="monospace" font-size="12" fill="black">tarefa ja finalizada</text>
</svg>
